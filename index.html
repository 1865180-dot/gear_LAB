<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歯車ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 設計メモ: 製図板の方眼紙の上に、しんちゅう色の歯車を置く。1テーマ固定(明るい紙)。 */
:root{
  color-scheme:light;
  --paper:#eef3f6; --grid:#d9e3ea; --panel:#ffffff; --ink:#1c2b3a; --sub:#54687a;
  --brass:#e0a030; --blue:#2f6fb0; --accent:#e4572e; --ok:#23936a; --ng:#cf4040; --line:#c5d2dc;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);font-weight:500;color:var(--ink);line-height:1.65;font-size:16px;
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
header.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 16px}
.logo{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;padding:4px}
.logo svg{width:28px;height:28px}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs button{background:transparent;border:1.5px solid #ffffff55;color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
nav.tabs button[aria-current="true"]{background:var(--brass);border-color:var(--brass);color:var(--ink)}
nav.tabs .cnt{font-weight:500;opacity:.8;margin-left:6px;font-variant-numeric:tabular-nums}
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;padding:16px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:700}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.go{background:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sub{color:var(--sub);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:0 7px;background:#fff}
/* home */
.home-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:center}
.home-hero h1{font-size:34px;font-weight:900}
.home-hero svg{width:100%;height:auto;display:block}
.parts3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.pcard{text-align:left;background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:4px 4px 0 var(--ink)}
.pcard:hover{transform:translate(-1px,-1px)}
.pcard .no{font-family:var(--display);font-weight:900;color:var(--accent);font-size:14px}
.pcard h3{font-size:20px}
.pcard .prog{margin-top:auto;font-size:13px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.flow{margin-top:16px;font-size:14px}
.flow b{color:var(--accent)}
/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
.stage{width:100%;height:auto;display:block;background:#fff;border:1.5px solid var(--ink);border-radius:12px}
.glabel{font-size:15px;font-weight:700;fill:var(--ink)}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.gcard{background:#fff;border:1.5px solid var(--ink);border-top:8px solid var(--c);border-radius:10px;padding:8px 10px;font-size:13px}
.gcard .gname{font-weight:700;font-size:14px}
.stepper{display:flex;align-items:center;gap:6px;margin:4px 0}
.stepper button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--ink);background:#fff;font-weight:900;font-size:18px;line-height:1}
.stepper b{min-width:54px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.gcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 8px}
.gcard dt{color:var(--sub)}
.gcard dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.gcard label{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:4px}
.sum{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .big{font-family:var(--display);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.bar{height:16px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);transition:width .3s}
.bar.f i{background:var(--accent)}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--ink)}
.barrow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;font-size:13px;font-weight:700;margin-top:4px}
.wts{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.wts i{width:14px;height:16px;background:var(--sub);border-radius:2px 2px 4px 4px;display:block}
.side h2{font-size:20px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pills button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-weight:900}
.pills button.done{background:#d8f0e6}
.pills button[aria-current="true"]{background:var(--ink);color:#fff}
.side .txt{margin:8px 0;font-size:15px}
.side .txt b{background:linear-gradient(transparent 62%,#ffe08a 62%)}
.formula{font-weight:700;background:var(--paper);border:1.5px dashed var(--ink);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.task{border-left:6px solid var(--brass);background:#fff7e3;padding:8px 10px;border-radius:0 8px 8px 0;margin:10px 0;font-size:14px;font-weight:700}
.task.ok{border-color:var(--ok);background:#e2f5ec}
.quiz{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:10px}
.quiz .q{font-weight:700;margin-bottom:6px}
.quiz .ch{display:grid;gap:6px}
.quiz .ch button{text-align:left;background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:7px 10px}
.quiz .ch button.ok{background:#d8f0e6;border-color:var(--ok)}
.quiz .ch button.ng{background:#fbe3e3;border-color:var(--ng)}
.quiz .fb{margin-top:6px;font-size:14px;font-weight:700}
.quiz .fb.ok{color:var(--ok)} .quiz .fb.ng{color:var(--ng)}
/* zukan */
.zukan{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
.zlist{display:grid;gap:6px}
.zlist button{text-align:left;background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.zlist button[aria-current="true"]{background:var(--ink);color:#fff}
.zlist .ck{color:var(--ok)}
.zlist button[aria-current="true"] .ck{color:#9fe3c6}
.zdetail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.zdetail svg{width:100%;height:auto;background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;display:block}
.zdetail h2{font-size:26px;font-weight:900}
.zdetail ul{margin:6px 0;padding-left:1.2em}
.slabel{font-size:14px;font-weight:700;fill:var(--ink)}
/* game */
.levels{display:grid;gap:16px}
.lvgroup h2{font-size:19px;margin-bottom:8px}
.lvrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lv{text-align:left;background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:12px;box-shadow:3px 3px 0 var(--ink)}
.lv b{display:block;font-size:16px}
.stars{color:var(--brass);letter-spacing:2px;font-size:18px}
.stars i{color:var(--line);font-style:normal}
.ghead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:8px}
.ghead h2{font-size:22px;font-weight:900}
.goal{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.goal span{border:1.5px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;background:#fff}
.goal span.ok{background:#d8f0e6;border-color:var(--ok)} .goal span.ng{background:#fbe3e3;border-color:var(--ng)}
.pipe{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding:6px 2px 10px}
.pcell{flex:1 1 150px;min-width:150px;max-width:230px;background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;font-size:12px;text-align:center}
.pcell svg{width:100%;height:auto;background:var(--paper);border-radius:6px;display:block}
.pcell.slot{border-style:dashed;border-width:2px;cursor:pointer}
.pcell.slot.fill{border-style:solid}
.pcell.slot.hot{border-color:var(--accent);background:#fff3ee}
.pcell .nm{font-weight:700;font-size:13px}
.pcell .out{min-height:3.2em;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.arrow{align-self:center;font-weight:900;color:var(--sub)}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tray button{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:6px 12px;text-align:left;line-height:1.3}
.tray button b{display:block;font-size:14px}
.tray button small{color:var(--sub)}
.tray button[aria-pressed="true"]{background:var(--brass)}
.tray button:disabled{opacity:.35}
.result{margin-top:10px;border-radius:10px;padding:12px;border:1.5px solid var(--ink);background:#fff}
.result.ok{background:#e2f5ec} .result.ng{background:#fdeeee}
.result h3{font-size:19px}
.bike{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
.bike svg{width:100%;height:auto;display:block;background:#fff;border:1.5px solid var(--ink);border-radius:10px}
.seg{display:flex;gap:0;margin:4px 0 10px}
.seg button{flex:1;background:#fff;border:1.5px solid var(--ink);padding:6px 4px;font-weight:700;font-size:14px;margin-left:-1.5px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.meter{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px}
.meter b{font-variant-numeric:tabular-nums;text-align:right}
.toast{font-weight:700;color:var(--ng);min-height:1.6em}
.matome ol{padding-left:1.3em;margin:8px 0}
.matome li{margin:6px 0}
footer{text-align:center;font-size:12px;color:var(--sub);padding:0 16px 24px}
@media (max-width:900px){
  .lab,.zukan,.bike,.home-hero,.zdetail{grid-template-columns:1fr}
  .parts3{grid-template-columns:1fr}
  .zlist{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <button class="logo" id="logo" aria-label="ホームへ"><svg viewBox="-20 -20 40 40" aria-hidden="true"><path id="logoGear" fill="#e0a030"/><circle r="4" fill="#1c2b3a"/></svg>歯車ラボ</button>
  <nav class="tabs" id="tabs" aria-label="メニュー"></nav>
</header>
<main id="app"></main>
<footer>歯車ラボ © Irie Kanji</footer>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg',TAU=Math.PI*2,INK='#1c2b3a',PAPER='#eef3f6';
const GC=['#e0a030','#5b93c4','#77b06a','#d0725c','#9a82c9'];
const NUM=['①','②','③','④','⑤','⑥'];
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){const v=attrs[k];if(v===false||v==null)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat(3)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs||{})e.setAttribute(k,attrs[k]);if(parent)parent.append(e);return e}
function stext(p,x,y,t,o){const e=sv('text',Object.assign({x,y,'text-anchor':'middle',class:'slabel'},o||{}),p);e.textContent=t;return e}
const f1=n=>String(Math.round(n*10)/10);
const f2=n=>n.toFixed(2);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- 進みぐあいの保存 ---------- */
const KEY='haguruma-lab-v1';
let prog={lab:{},zukan:{},game:{},matome:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)prog=Object.assign(prog,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}

/* ---------- アニメーション ---------- */
let anims=[],lastT=0;
function loop(t){const dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;for(const f of anims.slice())f(dt);requestAnimationFrame(loop)}

/* ---------- 歯車を描く ---------- */
function gearPath(N,m,internal){const r=N*m/2,p=TAU/N,ra=internal?r-m*0.85:r+m*0.85,rf=internal?r+m*1.05:r-m*1.05;let d='';
  for(let i=0;i<N;i++){const a=i*p;[[a-0.5*p,rf],[a-0.27*p,rf],[a-0.13*p,ra],[a+0.13*p,ra],[a+0.27*p,rf]].forEach(([t,R],k)=>{d+=(i===0&&k===0?'M':'L')+(R*Math.cos(t)).toFixed(2)+' '+(R*Math.sin(t)).toFixed(2)})}
  return d+'Z'}
function makeGear(parent,o){const r=o.N*o.m/2,g=sv('g',{},parent);
  sv('path',{d:gearPath(o.N,o.m),fill:o.color,stroke:INK,'stroke-width':1.2,'stroke-linejoin':'round'},g);
  const ri=r-o.m*1.05;
  if(o.N>=20){sv('circle',{r:(ri*0.8).toFixed(1),fill:'rgba(255,255,255,.3)'},g);const n=o.N>=40?5:4;
    for(let i=0;i<n;i++){const a=i*TAU/n+0.5;sv('circle',{cx:(Math.cos(a)*ri*0.5).toFixed(1),cy:(Math.sin(a)*ri*0.5).toFixed(1),r:(ri*0.17).toFixed(1),fill:PAPER,stroke:INK,'stroke-width':0.8},g)}}
  sv('circle',{r:Math.max(3,o.m*0.9).toFixed(1),fill:INK},g);
  if(o.mark!==false)sv('circle',{cx:r,cy:0,r:(o.m*0.55).toFixed(1),fill:'#e4572e',stroke:'#fff','stroke-width':0.8},g);
  let X=o.x||0,Y=o.y||0;
  const set=(t,x,y)=>{if(x!=null){X=x;Y=y}g.setAttribute('transform','translate('+X.toFixed(2)+' '+Y.toFixed(2)+') rotate('+(t*180/Math.PI).toFixed(2)+')')};
  set(0);return{g,set,r}}
/* かみ合う相手の角度: 歯1と歯2が、方向φでかみ合う */
function meshAngle(t1,N1,N2,phi){return phi+Math.PI+(phi-t1)*N1/N2-Math.PI/N2}
/* 平歯車の列。gs:[{N,co}] co=前の歯車と同じ軸 */
function spurTrain(parent,gs,m,colors){const xs=[],w=[],els=[],th=[];let x=0;
  gs.forEach((g,i)=>{if(i===0)w[0]=1;else if(g.co)w[i]=w[i-1];else{x+=(gs[i-1].N+g.N)*m/2;w[i]=-w[i-1]*gs[i-1].N/g.N}xs[i]=x});
  gs.forEach((g,i)=>{els[i]=makeGear(parent,{N:g.N,m,x:xs[i],y:0,color:colors[i%colors.length]})});
  function update(t){th[0]=t;els[0].set(t);for(let i=1;i<gs.length;i++){th[i]=gs[i].co?th[i-1]:meshAngle(th[i-1],gs[i-1].N,gs[i].N,0);els[i].set(th[i])}}
  update(0);
  let minX=1e9,maxX=-1e9,maxR=0;gs.forEach((g,i)=>{const R=g.N*m/2+m;minX=Math.min(minX,xs[i]-R);maxX=Math.max(maxX,xs[i]+R);maxR=Math.max(maxR,R)});
  return{update,xs,w,minX,maxX,maxR}}
function arcArrow(p,x,y,R,cw,col){const a0=-140*Math.PI/180,a1=-40*Math.PI/180,P=a=>[x+R*Math.cos(a),y+R*Math.sin(a)],s=P(a0),e=P(a1);
  sv('path',{d:'M'+s[0].toFixed(1)+' '+s[1].toFixed(1)+' A'+R.toFixed(1)+' '+R.toFixed(1)+' 0 0 1 '+e[0].toFixed(1)+' '+e[1].toFixed(1),fill:'none',stroke:col,'stroke-width':3.5,'stroke-linecap':'round'},p);
  const a=cw?a1:a0,q=P(a),sg=cw?1:-1,tx=-Math.sin(a)*sg,ty=Math.cos(a)*sg,nx=Math.cos(a),ny=Math.sin(a);
  sv('polygon',{points:(q[0]+tx*13)+','+(q[1]+ty*13)+' '+(q[0]+nx*7)+','+(q[1]+ny*7)+' '+(q[0]-nx*7)+','+(q[1]-ny*7),fill:col},p)}
/* 横から見た歯車(歯のすじが動く) */
function sideGear(p,o){sv('rect',{x:o.x,y:o.y-o.R,width:o.w,height:2*o.R,rx:3,fill:o.color,stroke:INK,'stroke-width':1.4},p);
  const ls=[],pp=TAU/o.N;for(let i=0;i<o.N;i++)ls.push(sv('line',{stroke:INK,'stroke-width':o.sw||2,'stroke-linecap':'round'},p));
  return t=>{for(let i=0;i<o.N;i++){const a=t+i*pp,c=Math.cos(a),l=ls[i];if(c>0.1){const yy=o.y+o.R*Math.sin(a),dz=(o.hz||0)*c;l.setAttribute('x1',o.x+2);l.setAttribute('y1',(yy-dz).toFixed(1));l.setAttribute('x2',o.x+o.w-2);l.setAttribute('y2',(yy+dz).toFixed(1));l.setAttribute('visibility','visible')}else l.setAttribute('visibility','hidden')}}}
/* ベルト・チェーン */
function beltDrive(svg,o){const m=o.m||3,r1=o.chain?o.N1*m/2:o.r1,r2=o.chain?o.N2*m/2:o.r2,x1=o.x1,x2=o.x2,y=o.y,d=x2-x1,b=Math.asin((r1-r2)/d),sb=Math.sin(b),cb=Math.cos(b);
  const P=(x,r,s)=>(x+r*sb).toFixed(1)+' '+(y+s*r*cb).toFixed(1);
  const path='M'+P(x1,r1,-1)+' L'+P(x2,r2,-1)+' A'+r2+' '+r2+' 0 '+(r2>r1?1:0)+' 1 '+P(x2,r2,1)+' L'+P(x1,r1,1)+' A'+r1+' '+r1+' 0 '+(r1>r2?1:0)+' 1 '+P(x1,r1,-1)+'Z';
  let w1,w2,dash;
  if(o.chain){w1=makeGear(svg,{N:o.N1,m,x:x1,y,color:o.c1||GC[1]});w2=makeGear(svg,{N:o.N2,m,x:x2,y,color:o.c2||GC[0]});
    const pitch=Math.PI*m;sv('path',{d:path,fill:'none',stroke:'#fff','stroke-width':7,opacity:.7},svg);
    dash=sv('path',{d:path,fill:'none',stroke:INK,'stroke-width':5.5,'stroke-dasharray':(pitch*0.62).toFixed(2)+' '+(pitch*0.38).toFixed(2)},svg)}
  else{const pul=(x,r,c)=>{const g=sv('g',{},svg);sv('circle',{r,fill:c,stroke:INK,'stroke-width':1.4},g);sv('circle',{r:r*0.72,fill:'rgba(255,255,255,.35)'},g);for(let i=0;i<3;i++){const a=i*TAU/3;sv('line',{x1:0,y1:0,x2:(Math.cos(a)*r*0.72).toFixed(1),y2:(Math.sin(a)*r*0.72).toFixed(1),stroke:INK,'stroke-width':3},g)}sv('circle',{r:4,fill:INK},g);sv('circle',{cx:r*0.86,r:3.5,fill:'#e4572e',stroke:'#fff','stroke-width':.8},g);return{set:t=>g.setAttribute('transform','translate('+x+' '+y+') rotate('+(t*180/Math.PI).toFixed(2)+')')}};
    w1=pul(x1,r1,o.c1||GC[1]);w2=pul(x2,r2,o.c2||GC[0]);
    sv('path',{d:path,fill:'none',stroke:'#3a3a3a','stroke-width':7,'stroke-linejoin':'round'},svg);

  return t=>{w1.set(t);w2.set(t*r1/r2);dash.setAttribute('stroke-dashoffset',(-t*r1).toFixed(1))}}

  const gon=[];for(let i=0;i<8;i++){const g=sv('g',{},svg);sv('line',{x1:0,y1:0,x2:0,y2:8,stroke:INK,'stroke-width':2},g);sv('rect',{x:-12,y:8,width:24,height:19,rx:5,fill:GC[i%5],stroke:INK,'stroke-width':1.3},g);sv('rect',{x:-7,y:12,width:14,height:7,rx:2,fill:'#fff'},g);gon.push(g)}
  arcArrow(svg,cx,cy,R+16,dir>0,'#e4572e');if(cy-R-26>=16)stext(svg,cx,cy-R-26,'観覧車('+(dir>0?'右回り':'左回り')+'に回す)');else stext(svg,cx-R-14,26,'観覧車('+(dir>0?'右回り':'左回り')+'に回す)',{'text-anchor':'end'});
  const up=t=>{rot.setAttribute('transform','translate('+cx+' '+cy+') rotate('+(t*180/Math.PI).toFixed(2)+')');gon.forEach((g,i)=>{const a=t+i*TAU/8;g.setAttribute('transform','translate('+(cx+R*Math.cos(a)).toFixed(1)+' '+(cy+R*Math.sin(a)).toFixed(1)+')')})};up(0);return up}
function drawMgr(svg,cx,jy){const py=jy-64,top=py-150,hs=[],ls=[];
  sv('rect',{x:cx-5,y:top+30,width:10,height:jy-52-top-30,fill:'#9fb1c0',stroke:INK,'stroke-width':1.2},svg);
  const back=sv('g',{},svg);
  sv('rect',{x:cx-104,y:py,width:208,height:12,rx:4,fill:'#d0725c',stroke:INK,'stroke-width':1.5},svg);
  sv('polygon',{points:(cx-112)+','+(top+44)+' '+cx+','+top+' '+(cx+112)+','+(top+44),fill:'#e0a030',stroke:INK,'stroke-width':1.5,'stroke-linejoin':'round'},svg);
  for(let i=0;i<7;i++)sv('path',{d:'M'+(cx-112+i*32)+' '+(top+44)+' q16 16 32 0',fill:i%2?'#fff':'#d0725c',stroke:INK,'stroke-width':1.2},svg);
  sv('circle',{cx,cy:top-4,r:6,fill:'#e4572e',stroke:INK},svg);
  const front=sv('g',{},svg);
  for(let i=0;i<6;i++){const g=sv('g',{},svg);sv('line',{x1:0,y1:-62,x2:0,y2:20,stroke:'#54687a','stroke-width':2.5},g);sv('ellipse',{cx:0,cy:-8,rx:15,ry:8,fill:'#fff',stroke:INK,'stroke-width':1.3},g);sv('circle',{cx:14,cy:-19,r:6,fill:'#fff',stroke:INK,'stroke-width':1.3},g);sv('path',{d:'M-9 -2 L-10 10 M8 -2 L9 10',stroke:INK,'stroke-width':2,fill:'none'},g);sv('rect',{x:-5,y:-15,width:10,height:6,rx:2,fill:GC[i%5],stroke:INK,'stroke-width':1},g);hs.push(g)}
  sv('polygon',{points:(cx-34)+','+(jy-52)+' '+(cx+34)+','+(jy-52)+' '+(cx+22)+','+(jy-28)+' '+(cx-22)+','+(jy-28),fill:'#c9b8e6',stroke:INK,'stroke-width':1.4,'stroke-linejoin':'round'},svg);
  for(let i=0;i<12;i++)ls.push(sv('line',{stroke:INK,'stroke-width':1.8},svg));
  stext(svg,cx,top-18,'メリーゴーランド(縦の軸)');
  const up=t=>{hs.forEach((g,i)=>{const a=t+i*TAU/6,c=Math.cos(a);(c>=0?front:back).append(g);g.setAttribute('opacity',c>=0?1:0.4);g.setAttribute('transform','translate('+(cx+86*Math.sin(a)).toFixed(1)+' '+(py-34+Math.sin(a*2+i)*6).toFixed(1)+') scale('+(0.8+0.2*c).toFixed(2)+')')});
    ls.forEach((l,i)=>{const b=t+i*TAU/12,sn=Math.sin(b);if(Math.cos(b)>0.1){l.setAttribute('x1',(cx+33*sn).toFixed(1));l.setAttribute('y1',jy-51);l.setAttribute('x2',(cx+21*sn).toFixed(1));l.setAttribute('y2',jy-29);l.setAttribute('visibility','visible')}else l.setAttribute('visibility','hidden')})};up(0);return up}
function boardScreen(L){const root=h('div',{});let placed=[],tray=Object.assign({},L.tray),sel=null,won=false,th=0;
  const all=()=>{const a=[{x:L.motor[0],y:L.motor[1],N:10,motor:true}];if(L.ferris)a.push({x:L.ferris.at[0],y:L.ferris.at[1],N:30,ferris:true});return a.concat(placed)};
  function cands(N){const r=N/10,gs=all(),out=[];for(let x=r;x<=BW-r;x++)for(let y=r;y<=BH-r;y++){let mesh=false,bad=false;for(const g of gs){const d2=(g.x-x)*(g.x-x)+(g.y-y)*(g.y-y),s=r+brad(g);if(d2<s*s){bad=true;break}if(d2===s*s)mesh=true}if(!bad&&(mesh||(L.mgr&&x===L.mgr.at[0]&&y===L.mgr.at[1])))out.push([x,y])}return out}
  function draw(){anims=[];const gs=all(),sol=boardSolve(gs),svg=sv('svg',{viewBox:'0 0 '+BW*U+' '+BH*U,class:'stage',role:'img','aria-label':'歯車をはめる盤面'});
    const pid='dots'+Math.random().toString(36).slice(2,7),pat=sv('pattern',{id:pid,width:U,height:U,patternUnits:'userSpaceOnUse',x:-U/2,y:-U/2},sv('defs',{},svg));sv('circle',{cx:U/2,cy:U/2,r:1.4,fill:'#b9c7d2'},pat);
    sv('rect',{width:BW*U,height:BH*U,fill:'#fff'},svg);sv('rect',{width:BW*U,height:BH*U,fill:'url(#'+pid+')'},svg);
    const fUp=L.ferris?drawFerris(svg,L.ferris.at[0]*U,L.ferris.at[1]*U,L.ferris.dir):null;
    const mx=L.motor[0]*U,my=L.motor[1]*U;sv('rect',{x:mx-36,y:my-30,width:72,height:60,rx:10,fill:'#54687a',stroke:INK,'stroke-width':1.5},svg);stext(svg,mx,my-38,'モーター(右回り)',{'font-size':13});
    if(L.mgr){sv('circle',{cx:L.mgr.at[0]*U,cy:L.mgr.at[1]*U,r:2*U,fill:'#f4effb',stroke:'#9a82c9','stroke-width':2.5,'stroke-dasharray':'7 5'},svg);stext(svg,L.mgr.at[0]*U,L.mgr.at[1]*U+2*U+18,'かさ歯車の穴',{'font-size':13})}
    const els=gs.map((g,i)=>{const pt=g.part?BPARTS[g.part]:null,e=makeGear(svg,{N:g.N,m:BM,x:g.x*U,y:g.y*U,color:g.motor?GC[0]:g.ferris?'#9fb1c0':pt.col});
      if(pt&&pt.bevel){const r=e.r;sv('circle',{r:r*0.72,fill:'#e4dbf3',stroke:INK,'stroke-width':1.2},e.g);for(let k=0;k<12;k++){const a=k*TAU/12;sv('line',{x1:(Math.cos(a)*r*0.4).toFixed(1),y1:(Math.sin(a)*r*0.4).toFixed(1),x2:(Math.cos(a)*r*0.72).toFixed(1),y2:(Math.sin(a)*r*0.72).toFixed(1),stroke:INK,'stroke-width':1.5},e.g)}sv('circle',{r:r*0.4,fill:'#9a82c9',stroke:INK,'stroke-width':1.2},e.g);sv('circle',{r:4,fill:INK},e.g)}
      if(g.part){e.g.style.cursor='pointer';e.g.setAttribute('data-g',g.x+','+g.y);e.g.addEventListener('click',()=>{tray[g.part]++;placed=placed.filter(p=>p!==g);won=false;draw()})}return e});
    const jg=L.mgr?gs.findIndex(g=>g.part&&g.x===L.mgr.at[0]&&g.y===L.mgr.at[1]):-1,mUp=L.mgr?drawMgr(svg,L.mgr.at[0]*U,L.mgr.at[1]*U):null;
    if(sel&&tray[sel]>0)cands(BPARTS[sel].N).forEach(([x,y])=>{const c=sv('circle',{cx:x*U,cy:y*U,r:8.5,fill:'#e4572e',stroke:'#fff','stroke-width':2.5,opacity:.9,'data-c':x+','+y,tabindex:0,role:'button','aria-label':'ここにはめる'},svg);c.style.cursor='pointer';
      const put=()=>{placed.push({x,y,N:BPARTS[sel].N,part:sel});tray[sel]--;if(!tray[sel])sel=null;draw()};c.addEventListener('click',put);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();put()}})});
    const chips=[];let ok=!sol.jam;
    if(L.ferris){const w=sol.w[1],good=w!=null&&!sol.jam&&Math.sign(w)===L.ferris.dir;ok=ok&&good;chips.push([good?'ok':w!=null&&!sol.jam?'ng':'','観覧車:'+(sol.jam?'動かない':w==null?'まだ止まっている':good?'○ '+(w>0?'右':'左')+'回りで回っている':'× 逆向き('+(w>0?'右':'左')+'回り)に回っている')])}
    if(L.mgr){const pw=jg>=0&&sol.w[jg]!=null&&!sol.jam,good=pw&&BPARTS[gs[jg].part].bevel;ok=ok&&good;chips.push([good?'ok':pw?'ng':'','メリーゴーランド:'+(good?'○ 回っている':pw?'× 平歯車では縦の軸に伝わらない':'まだ止まっている')])}
    if(sol.jam)chips.push(['ng','× 歯車がロックして動かない(輪になってかみ合っている歯車を外そう)']);
    const res=h('div');
    const showWin=()=>{const n=placed.length,s=n<=L.best?3:n<=L.best+2?2:1;win(L,s);res.replaceChildren(h('div',{class:'result ok'},h('h3',{},'成功! 歯車'+n+'個 ',starsEl(s)),h('p',{},L.win),h('div',{class:'row',style:'margin-top:8px'},s<3?h('span',{class:'sub'},'もっと少ない歯車でもつなげる。'):null,nextLevel(L))))};
    if(won)showWin();
    root.replaceChildren(gameHead(L),h('p',{},L.story),h('div',{class:'goal'},chips.map(c=>h('span',{class:c[0]},c[1]))),svg,
      h('p',{class:'sub',style:'margin-top:6px'},sel?'赤く光る穴を押すと、そこに歯車がはまる。':'下の歯車を選ぶと、かみ合う穴が赤く光る。はめた歯車を押すと外せる。'),
      h('div',{class:'tray'},Object.keys(L.tray).map(id=>h('button',{'aria-pressed':String(sel===id),disabled:tray[id]?null:true,onclick:()=>{sel=sel===id?null:id;draw()}},h('b',{},BPARTS[id].name+' ×'+tray[id]),h('small',{},BPARTS[id].sub))),
        h('button',{onclick:()=>{placed=[];tray=Object.assign({},L.tray);sel=null;won=false;draw()}},h('b',{},'全部外す'),h('small',{},'最初からやり直す'))),
      h('p',{class:'sub'},'ヒント:'+L.hint),res);
    const ang=gs.map(()=>0);let okT=0;
    const upd=()=>{if(!sol.jam)for(const i of sol.order){if(i===0)ang[0]=th;else{const p=sol.par[i],a=gs[p],b=gs[i];ang[i]=meshAngle(ang[p],a.N,b.N,Math.atan2(b.y-a.y,b.x-a.x))}els[i].set(ang[i])}
      if(fUp)fUp(sol.w[1]!=null&&!sol.jam?ang[1]:0);if(mUp)mUp(jg>=0&&sol.w[jg]!=null&&!sol.jam&&BPARTS[gs[jg].part].bevel?ang[jg]:0)};upd();
    anims.push(dt=>{th+=dt*2.4;upd();if(ok&&!won){okT+=dt;if(okT>2.2){won=true;showWin()}}})}
  draw();return root}

 {id:'q2',t:'坂を登る力の強い電気自動車の模型をつくりたい。どうする?',c:['モーター側を小さい歯車、タイヤ側を大きい歯車にして、速度伝達比を大きくする','モーター側を大きい歯車、タイヤ側を小さい歯車にする','歯車を使わず直接つなぐ'],a:0,ex:'速度伝達比を大きくするとトルクが大きくなる。2段、3段と重ねるとさらに強くなる。'}];
function matomeScreen(){const root=h('div',{class:'panel matome'});function draw(){root.replaceChildren(h('h2',{style:'font-size:24px;font-weight:900'},'まとめ'),
  h('ol',{},h('li',{},'かみ合う歯車は、たがいに',h('b',{},'逆向き'),'に回る。間に1つ入れると元の向きにもどる。'),
    h('li',{},h('b',{},'速度伝達比 = 被動歯車の歯数 ÷ 駆動歯車の歯数'),'。'),
    h('li',{},'速度伝達比が大きいと、',h('b',{},'おそいが力(トルク)は強い'),'。小さいと、',h('b',{},'速いが力は弱い'),'。速さと力を両方いっぺんに増やすことはできない。'),
    h('li',{},'歯車の種類を選ぶと、軸の向きを変えたり(かさ歯車)、直線の動きに変えたり(ラックとピニオン)、逆から回せなくしたり(ウォームギヤ)できる。')),
  h('p',{style:'font-weight:700;margin-top:10px'},'次の時間は、電気自動車の模型をつくる。作戦を考えよう。'),
  MQ.map(q=>quiz(q,prog.matome[q.id],()=>{prog.matome[q.id]=true;save();draw()})),
  prog.matome.q1&&prog.matome.q2?h('p',{class:'task ok',style:'margin-top:12px'},'これで準備は完了。自分の車は「速さ」と「力」のどちらを大切にするか、歯車の組み合わせをノートにかいておこう。'):null)}
